[project]
name = "sk-video-watch"
version = "0.1.0"
description = "A small personal football watch page"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "html5lib>=1.1,<2",
    "uvicorn>=0.34,<1",
    "playwright>=1.58,<2",
    "curl-cffi>=0.13,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
